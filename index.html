<!DOCTYPE html>
<html>
<head>
  <title>JS Tab Navigation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="tabs">
    <button onclick="openTab(0)">Home</button>
    <button onclick="openTab(1)">Profile</button>
    <button onclick="openTab(2)">Settings</button>

    <div class="content" id="tab0">Welcome to Home</div>
    <div class="content" id="tab1">User Profile Info</div>
    <div class="content" id="tab2">Settings Panel</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
